<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="tbf353f-0">$</text>
<text x="26.4" y="63.3" textLength="126" lengthAdjust="spacingAndGlyphs" class="tbf353f-1"> ditx help init</text>
<text x="18" y="81.5" textLength="201.6" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">usage: ditx init [flags]</text>
<text x="18" y="117.9" textLength="411.6" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">write .env (your team, default robot, ROS distro)</text>
<text x="18" y="154.3" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">options:</text>
<text x="18" y="172.5" textLength="403.2" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">  -h, --help     show this help message and exit</text>
<text x="18" y="190.7" textLength="445.2" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">  -n, --dry-run  print what would run, change nothing</text>
<text x="18" y="208.9" textLength="428.4" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">  -v, --verbose  show the full output of every tool</text>
<text x="18" y="227.1" textLength="394.8" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">  -q, --quiet    print only warnings and errors</text>
<text x="18" y="245.3" textLength="403.2" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">  --defaults     take every default, ask nothing</text>
<text x="18" y="281.7" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">Examples:</text>
<text x="18" y="299.9" textLength="92.4" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">  ditx init</text>
<text x="18" y="318.1" textLength="184.8" lengthAdjust="spacingAndGlyphs" class="tbf353f-1">  ditx init --defaults</text>
</g>
<rect x="0.5" y="0.5" width="875" height="336" rx="9.5" fill="none" stroke="#2b2d48"/>
</svg>
