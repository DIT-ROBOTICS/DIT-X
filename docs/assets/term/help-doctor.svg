<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="t0c7c33-0">$</text>
<text x="26.4" y="63.3" textLength="142.8" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1"> ditx help doctor</text>
<text x="18" y="81.5" textLength="218.4" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">usage: ditx doctor [flags]</text>
<text x="18" y="117.9" textLength="478.8" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">check the host (docker, disk, RAM) and robot reachability</text>
<text x="18" y="154.3" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">options:</text>
<text x="18" y="172.5" textLength="462" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">  -h, --help            show this help message and exit</text>
<text x="18" y="190.7" textLength="504" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">  -n, --dry-run         print what would run, change nothing</text>
<text x="18" y="208.9" textLength="487.2" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">  -v, --verbose         show the full output of every tool</text>
<text x="18" y="227.1" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">  -q, --quiet           print only warnings and errors</text>
<text x="18" y="245.3" textLength="210" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">  -r ROBOT, --robot ROBOT</text>
<text x="18" y="263.5" textLength="495.6" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">                        target robot from config/robots.ini</text>
<text x="18" y="281.7" textLength="478.8" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">  --json                machine-readable output on stdout</text>
<text x="18" y="318.1" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">Examples:</text>
<text x="18" y="336.3" textLength="109.2" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">  ditx doctor</text>
<text x="18" y="354.5" textLength="201.6" lengthAdjust="spacingAndGlyphs" class="t0c7c33-1">  ditx doctor -r &lt;robot&gt;</text>
</g>
