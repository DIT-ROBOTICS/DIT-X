<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="tc4e715-0">$</text>
<text x="26.4" y="63.3" textLength="126" lengthAdjust="spacingAndGlyphs" class="tc4e715-1"> ditx help docs</text>
<text x="18" y="81.5" textLength="277.2" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">usage: ditx docs [ACTION] [flags]</text>
<text x="18" y="117.9" textLength="504" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">preview or build the user manual (MkDocs Material in Docker)</text>
<text x="18" y="154.3" textLength="176.4" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">positional arguments:</text>
<text x="18" y="172.5" textLength="252" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  {serve,build}         action</text>
<text x="18" y="208.9" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">options:</text>
<text x="18" y="227.1" textLength="462" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  -h, --help            show this help message and exit</text>
<text x="18" y="245.3" textLength="504" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  -n, --dry-run         print what would run, change nothing</text>
<text x="18" y="263.5" textLength="487.2" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  -v, --verbose         show the full output of every tool</text>
<text x="18" y="281.7" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  -q, --quiet           print only warnings and errors</text>
<text x="18" y="299.9" textLength="436.8" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  -p PORT, --port PORT  preview port (default: 8000)</text>
<text x="18" y="336.3" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">Choices:</text>
<text x="18" y="354.5" textLength="604.8" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  action serve  live preview on http://localhost:&lt;port&gt;, reloads on save</text>
<text x="18" y="372.7" textLength="579.6" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  action build  strict build into site/, exactly like the docs CI job</text>
<text x="18" y="409.1" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">Examples:</text>
<text x="18" y="427.3" textLength="92.4" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  ditx docs</text>
<text x="18" y="445.5" textLength="142.8" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  ditx docs build</text>
<text x="18" y="463.7" textLength="210" lengthAdjust="spacingAndGlyphs" class="tc4e715-1">  ditx docs serve -p 8001</text>
</g>
<rect x="0.5" y="0.5" width="875" height="481.6" rx="9.5" fill="none" stroke="#2b2d48"/>
</svg>
