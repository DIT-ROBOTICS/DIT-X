<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="taf1d52-0">$</text>
<text x="26.4" y="63.3" textLength="117.6" lengthAdjust="spacingAndGlyphs" class="taf1d52-1"> ditx help new</text>
<text x="18" y="81.5" textLength="319.2" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">usage: ditx new DOMAIN PACKAGE [flags]</text>
<text x="18" y="117.9" textLength="369.6" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">scaffold a new ROS 2 package inside a domain</text>
<text x="18" y="154.3" textLength="176.4" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">positional arguments:</text>
<text x="18" y="172.5" textLength="428.4" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  domain               domain to add the package to</text>
<text x="18" y="190.7" textLength="613.2" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  package              package name, snake_case, prefixed with the domain</text>
<text x="18" y="227.1" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">options:</text>
<text x="18" y="245.3" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  -h, --help           show this help message and exit</text>
<text x="18" y="263.5" textLength="495.6" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  -n, --dry-run        print what would run, change nothing</text>
<text x="18" y="281.7" textLength="478.8" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  -v, --verbose        show the full output of every tool</text>
<text x="18" y="299.9" textLength="445.2" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  -q, --quiet          print only warnings and errors</text>
<text x="18" y="318.1" textLength="260.4" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  --lang {cpp,python}  language</text>
<text x="18" y="354.5" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">Choices:</text>
<text x="18" y="372.7" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  --lang cpp     C++ node (rclcpp, ament_cmake, gtest)</text>
<text x="18" y="390.9" textLength="487.2" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  --lang python  Python node (rclpy, ament_python, pytest)</text>
<text x="18" y="427.3" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">Examples:</text>
<text x="18" y="445.5" textLength="344.4" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  ditx new vision vision_aruco --lang cpp</text>
<text x="18" y="463.7" textLength="352.8" lengthAdjust="spacingAndGlyphs" class="taf1d52-1">  ditx new main main_planner --lang python</text>
</g>
<rect x="0.5" y="0.5" width="875" height="481.6" rx="9.5" fill="none" stroke="#2b2d48"/>
