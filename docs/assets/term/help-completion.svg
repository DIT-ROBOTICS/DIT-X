<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="t1e769d-0">$</text>
<text x="26.4" y="63.3" textLength="176.4" lengthAdjust="spacingAndGlyphs" class="t1e769d-1"> ditx help completion</text>
<text x="18" y="81.5" textLength="302.4" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">usage: ditx completion SHELL [flags]</text>
<text x="18" y="117.9" textLength="277.2" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">print the shell completion script</text>
<text x="18" y="154.3" textLength="176.4" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">positional arguments:</text>
<text x="18" y="172.5" textLength="201.6" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">  {bash,zsh,fish}  shell</text>
<text x="18" y="208.9" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">options:</text>
<text x="18" y="227.1" textLength="420" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">  -h, --help       show this help message and exit</text>
<text x="18" y="245.3" textLength="462" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">  -n, --dry-run    print what would run, change nothing</text>
<text x="18" y="263.5" textLength="445.2" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">  -v, --verbose    show the full output of every tool</text>
<text x="18" y="281.7" textLength="411.6" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">  -q, --quiet      print only warnings and errors</text>
<text x="18" y="318.1" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">Choices:</text>
<text x="18" y="336.3" textLength="151.2" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">  shell bash  bash</text>
<text x="18" y="354.5" textLength="142.8" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">  shell zsh   zsh</text>
<text x="18" y="372.7" textLength="151.2" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">  shell fish  fish</text>
<text x="18" y="409.1" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">Examples:</text>
<text x="18" y="427.3" textLength="268.8" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">  source &lt;(ditx completion bash)</text>
<text x="18" y="445.5" textLength="260.4" lengthAdjust="spacingAndGlyphs" class="t1e769d-1">  ditx completion fish | source</text>
</g>
<rect x="0.5" y="0.5" width="875" height="463.4" rx="9.5" fill="none" stroke="#2b2d48"/>
