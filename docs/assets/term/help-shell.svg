<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="t579b19-0">$</text>
<text x="26.4" y="63.3" textLength="134.4" lengthAdjust="spacingAndGlyphs" class="t579b19-1"> ditx help shell</text>
<text x="18" y="81.5" textLength="210" lengthAdjust="spacingAndGlyphs" class="t579b19-1">usage: ditx shell [flags]</text>
<text x="18" y="117.9" textLength="504" lengthAdjust="spacingAndGlyphs" class="t579b19-1">open a shell in the dev container with the workspace sourced</text>
<text x="18" y="154.3" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t579b19-1">options:</text>
<text x="18" y="172.5" textLength="403.2" lengthAdjust="spacingAndGlyphs" class="t579b19-1">  -h, --help     show this help message and exit</text>
<text x="18" y="190.7" textLength="445.2" lengthAdjust="spacingAndGlyphs" class="t579b19-1">  -n, --dry-run  print what would run, change nothing</text>
<text x="18" y="208.9" textLength="428.4" lengthAdjust="spacingAndGlyphs" class="t579b19-1">  -v, --verbose  show the full output of every tool</text>
<text x="18" y="227.1" textLength="394.8" lengthAdjust="spacingAndGlyphs" class="t579b19-1">  -q, --quiet    print only warnings and errors</text>
<text x="18" y="245.3" textLength="537.6" lengthAdjust="spacingAndGlyphs" class="t579b19-1">  --arch ARCH    CPU architecture of the shell (default: native)</text>
<text x="18" y="263.5" textLength="546" lengthAdjust="spacingAndGlyphs" class="t579b19-1">  --cmd CMD      run this command instead of an interactive shell</text>
<text x="18" y="299.9" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t579b19-1">Choices:</text>
<text x="18" y="318.1" textLength="546" lengthAdjust="spacingAndGlyphs" class="t579b19-1">  --arch amd64  x86-64 PCs and mini PCs (most laptops, Intel NUC)</text>
<text x="18" y="336.3" textLength="537.6" lengthAdjust="spacingAndGlyphs" class="t579b19-1">  --arch arm64  runs arm64 programs under qemu (see ditx doctor)</text>
<text x="18" y="372.7" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="t579b19-1">Examples:</text>
<text x="18" y="390.9" textLength="100.8" lengthAdjust="spacingAndGlyphs" class="t579b19-1">  ditx shell</text>
<text x="18" y="409.1" textLength="285.6" lengthAdjust="spacingAndGlyphs" class="t579b19-1">  ditx shell --cmd 'ros2 pkg list'</text>
</g>
<rect x="0.5" y="0.5" width="875" height="427" rx="9.5" fill="none" stroke="#2b2d48"/>
