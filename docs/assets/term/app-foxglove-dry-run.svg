<text x="18" y="190.7" textLength="739.2" lengthAdjust="spacingAndGlyphs" class="t04e998-2">ll/setup.bash &amp;&amp; exec ros2 run foxglove_bridge foxglove_bridge --ros-args -p port:=8765'</text>
