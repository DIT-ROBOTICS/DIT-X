<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="ta376a7-0">$</text>
<text x="26.4" y="63.3" textLength="260.4" lengthAdjust="spacingAndGlyphs" class="ta376a7-1"> git commit -am "update readme"</text>
<text x="18" y="81.5" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="ta376a7-1">✗ commit message does not follow Conventional Commits:</text>
<text x="18" y="99.7" textLength="142.8" lengthAdjust="spacingAndGlyphs" class="ta376a7-1">    update readme</text>
<text x="18" y="136.1" textLength="630" lengthAdjust="spacingAndGlyphs" class="ta376a7-1">  format:  type(scope): subject       (subject ≤ 100 chars, scope optional)</text>
<text x="18" y="154.3" textLength="546" lengthAdjust="spacingAndGlyphs" class="ta376a7-1">  types:   feat fix docs refactor perf test build ci chore revert</text>
<text x="18" y="172.5" textLength="504" lengthAdjust="spacingAndGlyphs" class="ta376a7-1">  example: feat(localization): fuse camera pose into the EKF</text>
<text x="18" y="190.7" textLength="529.2" lengthAdjust="spacingAndGlyphs" class="ta376a7-1">           fix(main): stop waiting for SIMA when it is disabled</text>
<text x="18" y="208.9" textLength="420" lengthAdjust="spacingAndGlyphs" class="ta376a7-1">  template: git config commit.template .gitmessage</text>
