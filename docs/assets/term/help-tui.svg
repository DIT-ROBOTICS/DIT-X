<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="ta66617-0">$</text>
<text x="26.4" y="63.3" textLength="117.6" lengthAdjust="spacingAndGlyphs" class="ta66617-1"> ditx help tui</text>
<text x="18" y="81.5" textLength="193.2" lengthAdjust="spacingAndGlyphs" class="ta66617-1">usage: ditx tui [flags]</text>
<text x="18" y="117.9" textLength="470.4" lengthAdjust="spacingAndGlyphs" class="ta66617-1">interactive command builder (same as running ditx alone)</text>
<text x="18" y="154.3" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="ta66617-1">options:</text>
<text x="18" y="172.5" textLength="403.2" lengthAdjust="spacingAndGlyphs" class="ta66617-1">  -h, --help     show this help message and exit</text>
<text x="18" y="190.7" textLength="445.2" lengthAdjust="spacingAndGlyphs" class="ta66617-1">  -n, --dry-run  print what would run, change nothing</text>
<text x="18" y="208.9" textLength="428.4" lengthAdjust="spacingAndGlyphs" class="ta66617-1">  -v, --verbose  show the full output of every tool</text>
<text x="18" y="227.1" textLength="394.8" lengthAdjust="spacingAndGlyphs" class="ta66617-1">  -q, --quiet    print only warnings and errors</text>
<text x="18" y="263.5" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="ta66617-1">Examples:</text>
<text x="18" y="281.7" textLength="50.4" lengthAdjust="spacingAndGlyphs" class="ta66617-1">  ditx</text>
<text x="18" y="299.9" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="ta66617-1">  ditx -n</text>
</g>
<rect x="0.5" y="0.5" width="875" height="317.8" rx="9.5" fill="none" stroke="#2b2d48"/>
</svg>
