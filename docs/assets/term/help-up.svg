<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="t267a56-0">$</text>
<text x="26.4" y="63.3" textLength="109.2" lengthAdjust="spacingAndGlyphs" class="t267a56-1"> ditx help up</text>
<text x="18" y="81.5" textLength="184.8" lengthAdjust="spacingAndGlyphs" class="t267a56-1">usage: ditx up [flags]</text>
<text x="18" y="117.9" textLength="386.4" lengthAdjust="spacingAndGlyphs" class="t267a56-1">start (or update) the runtime stack of a robot</text>
<text x="18" y="154.3" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t267a56-1">options:</text>
<text x="18" y="172.5" textLength="462" lengthAdjust="spacingAndGlyphs" class="t267a56-1">  -h, --help            show this help message and exit</text>
<text x="18" y="190.7" textLength="504" lengthAdjust="spacingAndGlyphs" class="t267a56-1">  -n, --dry-run         print what would run, change nothing</text>
<text x="18" y="208.9" textLength="487.2" lengthAdjust="spacingAndGlyphs" class="t267a56-1">  -v, --verbose         show the full output of every tool</text>
<text x="18" y="227.1" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="t267a56-1">  -q, --quiet           print only warnings and errors</text>
<text x="18" y="245.3" textLength="210" lengthAdjust="spacingAndGlyphs" class="t267a56-1">  -r ROBOT, --robot ROBOT</text>
<text x="18" y="263.5" textLength="495.6" lengthAdjust="spacingAndGlyphs" class="t267a56-1">                        target robot from config/robots.ini</text>
<text x="18" y="281.7" textLength="436.8" lengthAdjust="spacingAndGlyphs" class="t267a56-1">  --pull                pull the newest images first</text>
<text x="18" y="318.1" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="t267a56-1">Examples:</text>
<text x="18" y="336.3" textLength="134.4" lengthAdjust="spacingAndGlyphs" class="t267a56-1">  ditx up -r sim</text>
<text x="18" y="354.5" textLength="226.8" lengthAdjust="spacingAndGlyphs" class="t267a56-1">  ditx up -r &lt;robot&gt; --pull</text>
</g>
