<circle cx="20" cy="18.0" r="6" fill="#ff5f57"/><circle cx="40" cy="18.0" r="6" fill="#febc2e"/><circle cx="60" cy="18.0" r="6" fill="#28c840"/>
<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-0">$</text>
<text x="26.4" y="63.3" textLength="134.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1"> ditx help robot</text>
<text x="18" y="81.5" textLength="344.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">usage: ditx robot [ACTION] [NAME] [flags]</text>
<text x="18" y="117.9" textLength="394.8" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">list, add or remove robots in config/robots.ini</text>
<text x="18" y="154.3" textLength="176.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">positional arguments:</text>
<text x="18" y="172.5" textLength="260.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  {list,add,remove}  what to do</text>
<text x="18" y="190.7" textLength="361.2" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  name               robot name, e.g. white</text>
<text x="18" y="227.1" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">options:</text>
<text x="18" y="245.3" textLength="436.8" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  -h, --help         show this help message and exit</text>
<text x="18" y="263.5" textLength="478.8" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  -n, --dry-run      print what would run, change nothing</text>
<text x="18" y="281.7" textLength="462" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  -v, --verbose      show the full output of every tool</text>
<text x="18" y="299.9" textLength="428.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  -q, --quiet        print only warnings and errors</text>
<text x="18" y="318.1" textLength="604.8" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  --host H           robot hostname, e.g. DIT-2026-11, or any ssh target</text>
<text x="18" y="336.3" textLength="764.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  --user U           pin the ssh login (default: your own DIT_ROBOT_USER, set by ditx init)</text>
<text x="18" y="354.5" textLength="604.8" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  --domain-id N      ROS_DOMAIN_ID (default: the number in the hostname)</text>
<text x="18" y="372.7" textLength="562.8" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  --arch ARCH        CPU architecture of the robot (default: amd64)</text>
<text x="18" y="390.9" textLength="646.8" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  --profiles LIST    what runs there, comma separated (default: every domain)</text>
<text x="18" y="409.1" textLength="470.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  --tag TAG          image tag it runs (default: stable)</text>
<text x="18" y="427.3" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  --json             machine-readable output on stdout</text>
<text x="18" y="445.5" textLength="403.2" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  -y, --yes          do not ask for confirmation</text>
<text x="18" y="481.9" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">Choices:</text>
<text x="18" y="500.1" textLength="361.2" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  action list    show the configured robots</text>
<text x="18" y="518.3" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  action add     add a robot (needs a name and --host)</text>
<text x="18" y="536.5" textLength="369.6" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  action remove  remove a robot (asks first)</text>
<text x="18" y="554.7" textLength="554.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  --arch amd64   x86-64 PCs and mini PCs (most laptops, Intel NUC)</text>
<text x="18" y="572.9" textLength="697.2" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  --arch arm64   ARM boards (Raspberry Pi, Jetson); cross compiled on a PC, no qemu</text>
<text x="18" y="609.3" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">Examples:</text>
<text x="18" y="627.5" textLength="100.8" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  ditx robot</text>
<text x="18" y="645.7" textLength="344.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  ditx robot add white --host DIT-2026-11</text>
<text x="18" y="663.9" textLength="344.4" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  ditx robot add black --host DIT-2026-13</text>
<text x="18" y="682.1" textLength="210" lengthAdjust="spacingAndGlyphs" class="t7b1ae5-1">  ditx robot remove white</text>
</g>
<rect x="0.5" y="0.5" width="875" height="700" rx="9.5" fill="none" stroke="#2b2d48"/>
</svg>
