<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="tb75846-0">$</text>
<text x="26.4" y="63.3" textLength="142.8" lengthAdjust="spacingAndGlyphs" class="tb75846-1"> ditx help deploy</text>
<text x="18" y="81.5" textLength="218.4" lengthAdjust="spacingAndGlyphs" class="tb75846-1">usage: ditx deploy [flags]</text>
<text x="18" y="117.9" textLength="495.6" lengthAdjust="spacingAndGlyphs" class="tb75846-1">build + push an overlay, restart and verify (auto rollback)</text>
<text x="18" y="154.3" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="tb75846-1">options:</text>
<text x="18" y="172.5" textLength="462" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  -h, --help            show this help message and exit</text>
<text x="18" y="190.7" textLength="504" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  -n, --dry-run         print what would run, change nothing</text>
<text x="18" y="208.9" textLength="487.2" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  -v, --verbose         show the full output of every tool</text>
<text x="18" y="227.1" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  -q, --quiet           print only warnings and errors</text>
<text x="18" y="245.3" textLength="285.6" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  -d DOMAIN..., --domain DOMAIN...</text>
<text x="18" y="263.5" textLength="344.4" lengthAdjust="spacingAndGlyphs" class="tb75846-1">                        domains to deploy</text>
<text x="18" y="281.7" textLength="210" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  -r ROBOT, --robot ROBOT</text>
<text x="18" y="299.9" textLength="495.6" lengthAdjust="spacingAndGlyphs" class="tb75846-1">                        target robot from config/robots.ini</text>
<text x="18" y="318.1" textLength="411.6" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  --no-build            push the last build as is</text>
<text x="18" y="336.3" textLength="520.8" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  --persist             keep the overlay active after a reboot</text>
<text x="18" y="354.5" textLength="789.6" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  --allow-skew          deploy even if built against different interfaces than the robot image</text>
<text x="18" y="372.7" textLength="571.2" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  --no-rollback         leave a failed overlay running for debugging</text>
<text x="18" y="390.9" textLength="747.6" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  -j N, --jobs N        compile jobs per package (make -j): auto (by RAM/CPU) or a number</text>
<text x="18" y="427.3" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="tb75846-1">Examples:</text>
<text x="18" y="445.5" textLength="302.4" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  ditx deploy -d localization -r sim</text>
<text x="18" y="463.7" textLength="411.6" lengthAdjust="spacingAndGlyphs" class="tb75846-1">  ditx deploy -d main vision -r &lt;robot&gt; --persist</text>
</g>
<rect x="0.5" y="0.5" width="875" height="481.6" rx="9.5" fill="none" stroke="#2b2d48"/>
</svg>
