<text x="387.6" y="263.5" textLength="193.2" lengthAdjust="spacingAndGlyphs" class="tdb4a3f-2">default: native (amd64)</text>
<text x="34.8" y="281.7" textLength="184.8" lengthAdjust="spacingAndGlyphs" class="tdb4a3f-1">  new                 </text>
