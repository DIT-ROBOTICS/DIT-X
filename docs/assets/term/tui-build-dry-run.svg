<text x="253.2" y="172.5" textLength="403.2" lengthAdjust="spacingAndGlyphs" class="tdb4a3f-2">build domains in the dev container (incremental)</text>
<text x="34.8" y="190.7" textLength="184.8" lengthAdjust="spacingAndGlyphs" class="tdb4a3f-5">  build               </text>
