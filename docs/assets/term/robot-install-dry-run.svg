<text x="26.4" y="63.3" textLength="319.2" lengthAdjust="spacingAndGlyphs" class="t0dec3f-1"> sudo infra/robot/install.sh --dry-run</text>
<text x="18" y="81.5" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="t0dec3f-0">▸ install</text>
<text x="93.6" y="81.5" textLength="445.2" lengthAdjust="spacingAndGlyphs" class="t0dec3f-1">  ditrobotics:docker → /home/share/eurobot  (dry run)</text>
<text x="34.8" y="99.7" textLength="302.4" lengthAdjust="spacingAndGlyphs" class="t0dec3f-2">would install -d -m 0755 /home/share</text>
<text x="34.8" y="117.9" textLength="579.6" lengthAdjust="spacingAndGlyphs" class="t0dec3f-2">would install -d -o ditrobotics -g docker -m 2775 /home/share/eurobot</text>
<text x="34.8" y="136.1" textLength="655.2" lengthAdjust="spacingAndGlyphs" class="t0dec3f-2">would install -d -o ditrobotics -g docker -m 2775 /home/share/eurobot/overlays</text>
