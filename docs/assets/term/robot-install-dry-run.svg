<text x="34.8" y="500.1" textLength="470.4" lengthAdjust="spacingAndGlyphs" class="t0dec3f-2">would systemctl enable --now eurobot-log-retention.timer</text>
<text x="34.8" y="518.3" textLength="428.4" lengthAdjust="spacingAndGlyphs" class="t0dec3f-2">would systemctl enable --now eurobot-log-sync.timer</text>
<text x="34.8" y="536.5" textLength="470.4" lengthAdjust="spacingAndGlyphs" class="t0dec3f-2">would systemctl enable --now eurobot-syslog-export.timer</text>
