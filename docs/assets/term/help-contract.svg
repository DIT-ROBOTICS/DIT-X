<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="t71a923-0">$</text>
<text x="26.4" y="63.3" textLength="159.6" lengthAdjust="spacingAndGlyphs" class="t71a923-1"> ditx help contract</text>
<text x="18" y="81.5" textLength="310.8" lengthAdjust="spacingAndGlyphs" class="t71a923-1">usage: ditx contract [ACTION] [flags]</text>
<text x="18" y="117.9" textLength="537.6" lengthAdjust="spacingAndGlyphs" class="t71a923-1">validate the interface contract, render docs, check a live robot</text>
<text x="18" y="154.3" textLength="176.4" lengthAdjust="spacingAndGlyphs" class="t71a923-1">positional arguments:</text>
<text x="18" y="172.5" textLength="285.6" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  {validate,md,live}    what to do</text>
<text x="18" y="208.9" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t71a923-1">options:</text>
<text x="18" y="227.1" textLength="462" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  -h, --help            show this help message and exit</text>
<text x="18" y="245.3" textLength="504" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  -n, --dry-run         print what would run, change nothing</text>
<text x="18" y="263.5" textLength="487.2" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  -v, --verbose         show the full output of every tool</text>
<text x="18" y="281.7" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  -q, --quiet           print only warnings and errors</text>
<text x="18" y="299.9" textLength="210" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  -r ROBOT, --robot ROBOT</text>
<text x="18" y="318.1" textLength="495.6" lengthAdjust="spacingAndGlyphs" class="t71a923-1">                        target robot from config/robots.ini</text>
<text x="18" y="354.5" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t71a923-1">Choices:</text>
<text x="18" y="372.7" textLength="562.8" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  action validate  check contract.yaml (names, types, QoS profiles)</text>
<text x="18" y="390.9" textLength="546" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  action md        regenerate docs/contract.md from contract.yaml</text>
<text x="18" y="409.1" textLength="504" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  action live      compare a running robot with the contract</text>
<text x="18" y="445.5" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="t71a923-1">Examples:</text>
<text x="18" y="463.7" textLength="126" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  ditx contract</text>
<text x="18" y="481.9" textLength="151.2" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  ditx contract md</text>
<text x="18" y="500.1" textLength="226.8" lengthAdjust="spacingAndGlyphs" class="t71a923-1">  ditx contract live -r sim</text>
</g>
<rect x="0.5" y="0.5" width="875" height="518" rx="9.5" fill="none" stroke="#2b2d48"/>
