<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="t73e9d6-0">$</text>
<text x="26.4" y="63.3" textLength="134.4" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1"> ditx help index</text>
<text x="18" y="81.5" textLength="210" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">usage: ditx index [flags]</text>
<text x="18" y="117.9" textLength="478.8" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">merge compile_commands.json for clangd (go-to-definition)</text>
<text x="18" y="154.3" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">options:</text>
<text x="18" y="172.5" textLength="462" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">  -h, --help            show this help message and exit</text>
<text x="18" y="190.7" textLength="504" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">  -n, --dry-run         print what would run, change nothing</text>
<text x="18" y="208.9" textLength="487.2" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">  -v, --verbose         show the full output of every tool</text>
<text x="18" y="227.1" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">  -q, --quiet           print only warnings and errors</text>
<text x="18" y="245.3" textLength="285.6" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">  -d DOMAIN..., --domain DOMAIN...</text>
<text x="18" y="263.5" textLength="445.2" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">                        domains (default: all synced)</text>
<text x="18" y="299.9" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">Examples:</text>
<text x="18" y="318.1" textLength="100.8" lengthAdjust="spacingAndGlyphs" class="t73e9d6-1">  ditx index</text>
</g>
