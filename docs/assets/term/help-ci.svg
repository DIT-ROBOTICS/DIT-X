<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="t414c0e-0">$</text>
<text x="26.4" y="63.3" textLength="109.2" lengthAdjust="spacingAndGlyphs" class="t414c0e-1"> ditx help ci</text>
<text x="18" y="81.5" textLength="235.2" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">usage: ditx ci STAGE [flags]</text>
<text x="18" y="117.9" textLength="394.8" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">run one CI stage exactly like the pipeline does</text>
<text x="18" y="154.3" textLength="176.4" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">positional arguments:</text>
<text x="18" y="172.5" textLength="260.4" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  {lint,build,test,cross,image}</text>
<text x="18" y="190.7" textLength="243.6" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">                        stage</text>
<text x="18" y="227.1" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">options:</text>
<text x="18" y="245.3" textLength="462" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  -h, --help            show this help message and exit</text>
<text x="18" y="263.5" textLength="504" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  -n, --dry-run         print what would run, change nothing</text>
<text x="18" y="281.7" textLength="487.2" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  -v, --verbose         show the full output of every tool</text>
<text x="18" y="299.9" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  -q, --quiet           print only warnings and errors</text>
<text x="18" y="318.1" textLength="285.6" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  -d DOMAIN..., --domain DOMAIN...</text>
<text x="18" y="336.3" textLength="445.2" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">                        domains (default: all synced)</text>
<text x="18" y="372.7" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">Choices:</text>
<text x="18" y="390.9" textLength="546" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  stage lint   formatting, ruff, shellcheck, contract, boundaries</text>
<text x="18" y="409.1" textLength="277.2" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  stage build  build every domain</text>
<text x="18" y="427.3" textLength="537.6" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  stage test   base + domain unit tests and the integration test</text>
<text x="18" y="445.5" textLength="504" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  stage cross  build every domain for arm64 (cross compiled)</text>
<text x="18" y="463.7" textLength="495.6" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  stage image  build images (push on develop / main / tags)</text>
<text x="18" y="500.1" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">Examples:</text>
<text x="18" y="518.3" textLength="117.6" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  ditx ci lint</text>
<text x="18" y="536.5" textLength="117.6" lengthAdjust="spacingAndGlyphs" class="t414c0e-1">  ditx ci test</text>
</g>
<rect x="0.5" y="0.5" width="875" height="554.4" rx="9.5" fill="none" stroke="#2b2d48"/>
