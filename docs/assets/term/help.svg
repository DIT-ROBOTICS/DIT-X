<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="t496414-0">$</text>
<text x="26.4" y="63.3" textLength="100.8" lengthAdjust="spacingAndGlyphs" class="t496414-1"> ditx --help</text>
<text x="18" y="81.5" textLength="495.6" lengthAdjust="spacingAndGlyphs" class="t496414-1">ditx (DIT-X): build, test and deploy the Eurobot workspace.</text>
<text x="18" y="99.7" textLength="445.2" lengthAdjust="spacingAndGlyphs" class="t496414-1">Run `ditx` alone for the interactive command builder.</text>
<text x="18" y="136.1" textLength="42" lengthAdjust="spacingAndGlyphs" class="t496414-2">Usage</text>
<text x="18" y="154.3" textLength="201.6" lengthAdjust="spacingAndGlyphs" class="t496414-1">  ditx &lt;command&gt; [flags]</text>
<text x="18" y="190.7" textLength="134.4" lengthAdjust="spacingAndGlyphs" class="t496414-2">Develop commands</text>
<text x="18" y="208.9" textLength="520.8" lengthAdjust="spacingAndGlyphs" class="t496414-1">  build       build domains in the dev container (incremental)</text>
<text x="18" y="227.1" textLength="588" lengthAdjust="spacingAndGlyphs" class="t496414-1">  test        run unit tests (colcon test) and/or the integration test</text>
<text x="18" y="245.3" textLength="655.2" lengthAdjust="spacingAndGlyphs" class="t496414-1">  lint        check format and lint (clang-format, ruff, shellcheck, contract)</text>
<text x="18" y="263.5" textLength="596.4" lengthAdjust="spacingAndGlyphs" class="t496414-1">  index       merge compile_commands.json for clangd (go-to-definition)</text>
<text x="18" y="281.7" textLength="621.6" lengthAdjust="spacingAndGlyphs" class="t496414-1">  shell       open a shell in the dev container with the workspace sourced</text>
<text x="18" y="299.9" textLength="487.2" lengthAdjust="spacingAndGlyphs" class="t496414-1">  new         scaffold a new ROS 2 package inside a domain</text>
<text x="18" y="336.3" textLength="117.6" lengthAdjust="spacingAndGlyphs" class="t496414-2">Robot commands</text>
<text x="18" y="354.5" textLength="613.2" lengthAdjust="spacingAndGlyphs" class="t496414-1">  deploy      build + push an overlay, restart and verify (auto rollback)</text>
<text x="18" y="372.7" textLength="529.2" lengthAdjust="spacingAndGlyphs" class="t496414-1">  rollback    go back to the stable image (or an older overlay)</text>
<text x="18" y="390.9" textLength="621.6" lengthAdjust="spacingAndGlyphs" class="t496414-1">  overlays    list a robot's overlays: who pushed what, when, which commit</text>
<text x="18" y="409.1" textLength="504" lengthAdjust="spacingAndGlyphs" class="t496414-1">  up          start (or update) the runtime stack of a robot</text>
<text x="18" y="427.3" textLength="394.8" lengthAdjust="spacingAndGlyphs" class="t496414-1">  down        stop the runtime stack of a robot</text>
<text x="18" y="445.5" textLength="579.6" lengthAdjust="spacingAndGlyphs" class="t496414-1">  logs        show container logs of a robot, or fetch its log folder</text>
<text x="18" y="463.7" textLength="655.2" lengthAdjust="spacingAndGlyphs" class="t496414-1">  contract    validate the interface contract, render docs, check a live robot</text>
<text x="18" y="481.9" textLength="512.4" lengthAdjust="spacingAndGlyphs" class="t496414-1">  robot       list, add or remove robots in config/robots.ini</text>
<text x="18" y="518.3" textLength="151.2" lengthAdjust="spacingAndGlyphs" class="t496414-2">Workspace commands</text>
<text x="18" y="536.5" textLength="588" lengthAdjust="spacingAndGlyphs" class="t496414-1">  sync        fast-forward this repo, clone / fast-forward the domains</text>
<text x="18" y="554.7" textLength="495.6" lengthAdjust="spacingAndGlyphs" class="t496414-1">  list        packages of every domain: build type and path</text>
<text x="18" y="572.9" textLength="621.6" lengthAdjust="spacingAndGlyphs" class="t496414-1">  plugins     list plugins (ditx-&lt;name&gt; executables, run as `ditx &lt;name&gt;`)</text>
<text x="18" y="591.1" textLength="604.8" lengthAdjust="spacingAndGlyphs" class="t496414-1">  cd          jump to a domain or package directory (needs ./install.sh)</text>
<text x="18" y="609.3" textLength="630" lengthAdjust="spacingAndGlyphs" class="t496414-1">  status      branch / ahead / behind / dirty of the shell and every domain</text>
<text x="18" y="627.5" textLength="655.2" lengthAdjust="spacingAndGlyphs" class="t496414-1">  image       build images with docker buildx bake (base, dev, cross, runtime)</text>
<text x="18" y="645.7" textLength="277.2" lengthAdjust="spacingAndGlyphs" class="t496414-1">  clean       remove build output</text>
<text x="18" y="663.9" textLength="596.4" lengthAdjust="spacingAndGlyphs" class="t496414-1">  doctor      check the host (docker, disk, RAM) and robot reachability</text>
<text x="18" y="682.1" textLength="621.6" lengthAdjust="spacingAndGlyphs" class="t496414-1">  docs        preview or build the user manual (MkDocs Material in Docker)</text>
<text x="18" y="700.3" textLength="512.4" lengthAdjust="spacingAndGlyphs" class="t496414-1">  ci          run one CI stage exactly like the pipeline does</text>
<text x="18" y="718.5" textLength="529.2" lengthAdjust="spacingAndGlyphs" class="t496414-1">  init        write .env (your team, default robot, ROS distro)</text>
<text x="18" y="736.7" textLength="588" lengthAdjust="spacingAndGlyphs" class="t496414-1">  tui         interactive command builder (same as running ditx alone)</text>
<text x="18" y="754.9" textLength="394.8" lengthAdjust="spacingAndGlyphs" class="t496414-1">  completion  print the shell completion script</text>
<text x="18" y="791.3" textLength="58.8" lengthAdjust="spacingAndGlyphs" class="t496414-2">Plugins</text>
<text x="76.8" y="791.3" textLength="327.6" lengthAdjust="spacingAndGlyphs" class="t496414-3">  (ditx-&lt;name&gt; in tools/ext or on PATH)</text>
<text x="18" y="809.5" textLength="495.6" lengthAdjust="spacingAndGlyphs" class="t496414-1">  app         GUI tools: foxglove, rviz, gazebo, groot, qgc</text>
<text x="18" y="827.7" textLength="504" lengthAdjust="spacingAndGlyphs" class="t496414-1">  topics      live topics on a robot: name, type, publishers</text>
<text x="18" y="864.1" textLength="100.8" lengthAdjust="spacingAndGlyphs" class="t496414-2">Global flags</text>
<text x="18" y="882.3" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="t496414-1">  -n, --dry-run   print what would run, change nothing</text>
<text x="18" y="900.5" textLength="436.8" lengthAdjust="spacingAndGlyphs" class="t496414-1">  -v, --verbose   show the full output of every tool</text>
<text x="18" y="918.7" textLength="403.2" lengthAdjust="spacingAndGlyphs" class="t496414-1">  -q, --quiet     print only warnings and errors</text>
<text x="18" y="936.9" textLength="226.8" lengthAdjust="spacingAndGlyphs" class="t496414-1">  -h, --help      show help</text>
<text x="18" y="955.1" textLength="294" lengthAdjust="spacingAndGlyphs" class="t496414-1">  -V, --version   print the version</text>
<text x="18" y="991.5" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="t496414-2">Examples</text>
<text x="18" y="1009.7" textLength="210" lengthAdjust="spacingAndGlyphs" class="t496414-1">  ditx sync &amp;&amp; ditx build</text>
<text x="18" y="1027.9" textLength="210" lengthAdjust="spacingAndGlyphs" class="t496414-1">  ditx test --integration</text>
<text x="18" y="1046.1" textLength="302.4" lengthAdjust="spacingAndGlyphs" class="t496414-1">  ditx deploy -d localization -r sim</text>
<text x="18" y="1064.3" textLength="344.4" lengthAdjust="spacingAndGlyphs" class="t496414-1">  ditx robot add white --host DIT-2026-11</text>
<text x="18" y="1100.7" textLength="428.4" lengthAdjust="spacingAndGlyphs" class="t496414-1">Run `ditx help &lt;command&gt;` for details on a command.</text>
</g>
<rect x="0.5" y="0.5" width="875" height="1118.6" rx="9.5" fill="none" stroke="#2b2d48"/>
</svg>
