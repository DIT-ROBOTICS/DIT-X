<text x="438" y="22.5" text-anchor="middle" fill="#8a8db0" font-size="13">~/DIT-X</text>
<text x="18" y="63.3" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="tf278b4-0">$</text>
<text x="26.4" y="63.3" textLength="134.4" lengthAdjust="spacingAndGlyphs" class="tf278b4-1"> ditx help clean</text>
<text x="18" y="81.5" textLength="210" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">usage: ditx clean [flags]</text>
<text x="18" y="117.9" textLength="159.6" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">remove build output</text>
<text x="18" y="154.3" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">options:</text>
<text x="18" y="172.5" textLength="462" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">  -h, --help            show this help message and exit</text>
<text x="18" y="190.7" textLength="504" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">  -n, --dry-run         print what would run, change nothing</text>
<text x="18" y="208.9" textLength="487.2" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">  -v, --verbose         show the full output of every tool</text>
<text x="18" y="227.1" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">  -q, --quiet           print only warnings and errors</text>
<text x="18" y="245.3" textLength="285.6" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">  -d DOMAIN..., --domain DOMAIN...</text>
<text x="18" y="263.5" textLength="445.2" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">                        domains (default: all synced)</text>
<text x="18" y="281.7" textLength="470.4" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">  --base                also remove the local base build</text>
<text x="18" y="299.9" textLength="478.8" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">  --all                 remove the whole build/ directory</text>
<text x="18" y="318.1" textLength="428.4" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">  -y, --yes             do not ask for confirmation</text>
<text x="18" y="354.5" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">Examples:</text>
<text x="18" y="372.7" textLength="184.8" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">  ditx clean -d vision</text>
<text x="18" y="390.9" textLength="176.4" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">  ditx clean --all -y</text>
<text x="18" y="427.3" textLength="789.6" lengthAdjust="spacingAndGlyphs" class="tf278b4-1">Asks for confirmation (deletes build output; the next build starts from scratch); -y skips it.</text>
</g>
<rect x="0.5" y="0.5" width="875" height="445.2" rx="9.5" fill="none" stroke="#2b2d48"/>
</svg>
